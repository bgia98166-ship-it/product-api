name: Product Production CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-crud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGO_IMAGE: mongo:7
      MONGO_DATA_VOLUME: product-api-mongo-data

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run model tests
        run: npm test

      - name: Create database volume
        run: docker volume create product-api-mongo-data

      - name: Build and wait for healthy services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Show service status
        run: docker compose ps

      - name: Test real CRUD
        run: npm run test:integration

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup CI containers
        if: always()
        run: docker compose down